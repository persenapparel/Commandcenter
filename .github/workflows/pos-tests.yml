name: Persen POS development checks

on:
  push:
    branches:
      - feature/persen-pos-foundation
    paths:
      - 'pos/**'
      - 'supabase/functions/pos-receipt-email/**'
      - '.github/workflows/pos-tests.yml'
  pull_request:
    paths:
      - 'pos/**'
      - 'supabase/functions/pos-receipt-email/**'
      - '.github/workflows/pos-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pos-static-and-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pos_test
          POSTGRES_PASSWORD: pos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check pos/pos-core.js
          node --check pos/pos-events.js
          node --check pos/pos-receipt.js
          node --check pos/pos-digital-receipt.js
          node --check pos/pos-experience.js
          node --check pos/pos-cash.js
          node --check pos/register.js
          node --check pos/swivel-mode.js
          node --check pos/admin.js
          node --check pos/epson-center.js
          node --check pos/checkout-flow.js
          node --check pos/display.js
          node --check pos/epson-station/agent.cjs
      - name: Run POS unit tests
        run: node pos/tests.cjs
      - name: Test optional customer contact validation (offline)
        run: node --test pos/checkout-optional-contact-test.cjs
      - name: Guard no-tax staging checkout
        run: node pos/no-tax-checkout-regression.cjs
      - name: Guard 1-second scanner confirmation
        run: node pos/scan-confirmation-regression.cjs
      - name: Verify live cart, tiles and scanner integrations
        run: node pos/live-cart-structure-test.cjs
      - name: Run connected barcode and receipt-safety tests (offline)
        run: node --test pos/tests/*.test.cjs
      - name: Fail if a browser PIN is embedded in the staging home
        run: node pos/staging-access-guard.cjs
      - name: Test POS holiday and Simple Black appearance safeguards
        run: node pos/experience-tests.cjs
      - name: Test Resend receipt worker with offline mock provider
        run: node pos/receipt-worker-smoke.cjs
      - name: Validate customer iPad wizard flow and no-SMS receipt policy
        run: node pos/wizard-dom-check.cjs
      - name: Validate unapplied SQL draft structure
        run: node pos/sql-draft-check.cjs
      - name: Test POS schema and cash checkout in isolated PostgreSQL 17
        env:
          PGPASSWORD: pos_test_password
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: pos_test
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql -v ON_ERROR_STOP=1 -f pos/sql-integration-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f inventory/inventory-hub-2026.sql
          psql -v ON_ERROR_STOP=1 -f pos/pos-schema-review.sql
          psql -v ON_ERROR_STOP=1 -f pos/STAGING-DISPLAY-PAIRING.sql
          psql -v ON_ERROR_STOP=1 -f pos/square-live-cart-staging.sql
          psql -v ON_ERROR_STOP=1 -f pos/pos-customer-answers-v2.sql
          psql -v ON_ERROR_STOP=1 -f pos/pos-customer-answers-tests.sql
          psql -v ON_ERROR_STOP=1 -f pos/sql-integration-test.sql
          psql -v ON_ERROR_STOP=1 -f pos/epson-t20iv-staging.sql
          psql -v ON_ERROR_STOP=1 -f pos/tests/epson-staging-schema-test.sql
      - name: Build separate static POS project
        run: |
          node pos/build-pages.mjs
          test ! -e pos-dist/pos-schema-review.sql
          if grep -q 'icxeuhkqxxhdkfdappio' pos-dist/config.js; then echo 'Production Supabase URL leaked into POS output' && exit 1; fi
          if POS_SUPABASE_URL=https://icxeuhkqxxhdkfdappio.supabase.co POS_SUPABASE_PUBLISHABLE_KEY=sb_publishable_fake CF_PAGES=1 node pos/build-pages.mjs; then echo 'Production Supabase URL was wrongly accepted' && exit 1; fi
          if POS_SUPABASE_URL=https://wrong-project.supabase.co POS_SUPABASE_PUBLISHABLE_KEY=sb_publishable_fake CF_PAGES=1 node pos/build-pages.mjs; then echo 'Unapproved Supabase URL was wrongly accepted' && exit 1; fi
          test -f pos-dist/admin.html
          test -f pos-dist/admin.css
          test -f pos-dist/admin.js
          test -f pos-dist/epson-center.js
          test -f pos-dist/epson-center.css
          test ! -e pos-dist/print-station.js
          test ! -e pos-dist/print-station.css
          test ! -e pos-dist/test-fake-supabase.js
          test ! -e pos-dist/browser-full-flow-test.cjs
          test -f pos-dist/register.html
          test -f pos-dist/swivel-mode.js
          test -f pos-dist/swivel-mode.css
          test -f pos-dist/display.html
          test -f pos-dist/checkout-flow.js
          test -f pos-dist/customer-guest-client.js
          test -f pos-dist/print-station.html
          test -f pos-dist/pos-cash.js
          test -f pos-dist/pos-experience.js
          test -f pos-dist/pos-digital-receipt.js
      - name: Test real browser layouts on phones iPads and laptops
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node pos/responsive-viewport-smoke.cjs
      - name: Audit cashier, laptop, customer and printer button wiring
        run: node pos/button-control-audit.cjs
      - name: Prove sandboxed guest browser cannot read owner session
        run: |
          node --check pos/browser-customer-isolation-test.cjs
          node pos/browser-customer-isolation-test.cjs
      - name: Single-swivel cashier smoke and secure-handoff guard (isolated mock browser)
        run: |
          node --check pos/browser-full-flow-test.cjs
          node --check pos/test-fake-supabase.js
          node pos/browser-full-flow-test.cjs
      - name: Verify no payment backend is executed by tests
        run: |
          echo "Static build and offline unit tests only; do not run live payments or production DB changes"
