name: POS draft checks
on:
  push:
    branches: [feature/persen-pos-foundation]
    paths:
      - 'pos/**'
      - 'supabase/functions/pos-receipt-email/**'
      - '.github/workflows/pos-draft-checks.yml'
  pull_request:
    paths:
      - 'pos/**'
      - 'supabase/functions/pos-receipt-email/**'
      - '.github/workflows/pos-draft-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for f in pos/*.js pos/*.cjs pos/*.mjs; do node --check "$f"; done
      - name: Run POS unit tests
        run: node pos/tests.cjs
      - name: Check seasonal staging visual wiring
        run: |
          if [ -f pos/tests/christmas-cashier-ui-test.cjs ]; then node pos/tests/christmas-cashier-ui-test.cjs; fi
          if [ -f pos/tests/employee-home-navigation-contract.cjs ]; then node pos/tests/employee-home-navigation-contract.cjs; fi
          if [ -f pos/tests/sales_open_home_stale_checkout.test.cjs ]; then node pos/tests/sales_open_home_stale_checkout.test.cjs; fi
          if [ -f pos/tests/credential-scoped-permissions.test.cjs ]; then node pos/tests/credential-scoped-permissions.test.cjs; fi
          if [ -f pos/tests/deployment-readiness-dashboard.test.cjs ]; then node pos/tests/deployment-readiness-dashboard.test.cjs; fi
          if [ -f pos/tests/empty-stock-employee-home.test.cjs ]; then node --test pos/tests/empty-stock-employee-home.test.cjs; fi
          if [ -f pos/tests/employee-scoped-enrollment-preflight.test.cjs ]; then node --test pos/tests/employee-scoped-enrollment-preflight.test.cjs; fi
          if [ -f pos/tests/two-unique-sales-handoff.test.cjs ]; then node --test pos/tests/two-unique-sales-handoff.test.cjs; fi
          if [ -f pos/tests/staging-release-readiness-audit.test.cjs ]; then node --test pos/tests/staging-release-readiness-audit.test.cjs; fi
          if [ -f pos/tests/staging-deployment-guard.test.cjs ]; then node --test pos/tests/staging-deployment-guard.test.cjs; fi
      - name: Test Resend receipt worker with offline mock provider
        run: node pos/receipt-worker-smoke.cjs
      - name: Run POS structural checks
        run: |
          if [ -f pos/structural-tests.cjs ]; then node pos/structural-tests.cjs; fi
      - name: Build isolated POS site
        run: node pos/build-pages.mjs
      - name: Verify cashier and isolated guest pairing manifest
        run: node pos/tests/deployment-guest-origin.cjs
      - name: Verify staging build cannot leak production database or draft SQL
        run: |
          test ! -e pos-dist/pos-schema-review.sql
          if grep -q 'icxeuhkqxxhdkfdappio' pos-dist/config.js; then echo 'Production Supabase URL leaked into POS output' && exit 1; fi
          if POS_SUPABASE_URL=https://icxeuhkqxxhdkfdappio.supabase.co POS_SUPABASE_PUBLISHABLE_KEY=sb_publishable_fake CF_PAGES=1 node pos/build-pages.mjs; then echo 'Production Supabase URL was wrongly accepted' && exit 1; fi
      - name: Verify isolated build
        run: |
          test -f pos-dist/register.html
          test -f pos-dist/display.html
          # The retired browser print station must not be shipped; Epson's Windows agent is the only approved path.
          test ! -e pos-dist/print-station.html
          test ! -e pos-dist/print-station.js
          test ! -e pos-dist/print-station.css
          test -f pos-dist/assets/persen-logo.png
